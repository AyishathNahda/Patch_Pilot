[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot-sandbox"
version = "0.1.0"
requires-python = ">=3.11"
description = "Controlled Docker execution for PatchPilot curated fixtures"

[tool.setuptools.packages.find]
include = ["patchpilot_sandbox*"]
