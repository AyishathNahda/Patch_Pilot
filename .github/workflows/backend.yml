name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GROQ_API_KEY: ""
  PATCHPILOT_RUN_GROQ_TESTS: "0"

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt -e services/sandbox-runner
      - run: python -m pip check
      - run: python -m pytest -q -W error
        env:
          PATCHPILOT_RUN_DOCKER_TESTS: "0"

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt -e services/sandbox-runner
      - run: docker info
      - run: docker build --tag patchpilot-sandbox:day2 services/sandbox-runner
      - run: python -m pytest -q -W error -m docker
        env:
          PATCHPILOT_RUN_DOCKER_TESTS: "1"
